<div class="calendar-container">
    <header class="calendar-header">
        <h1>Calendar Obiective</h1>
        <div class="calendar-controls">
            <button class="control-button" (click)="prevMonth()">&lt;</button>
            <span>{{ monthNames[currentMonth] }} {{ currentYear }}</span>
            <button class="control-button" (click)="nextMonth()">&gt;</button>
        </div>
    </header>
    <div class="calendar">
        <div class="calendar-header-row">
            <div class="calendar-day">Sun</div>
            <div class="calendar-day">Mon</div>
            <div class="calendar-day">Tue</div>
            <div class="calendar-day">Wed</div>
            <div class="calendar-day">Thu</div>
            <div class="calendar-day">Fri</div>
            <div class="calendar-day">Sat</div>
        </div>
        <div *ngFor="let week of weeks" class="calendar-week">
            <div *ngFor="let date of week" class="calendar-date">
                <div *ngIf="date.date" class="date-number">{{ date.date }}</div>
                <!-- Afișează evenimentele -->
                <div *ngFor="let event of date.events" class="event">
                    {{ event.description }} - {{ event.amount }} {{ event.type }}
                </div>
            </div>
        </div>
    </div>
</div>
