<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up - Mindful Wallet</title>
  <link rel="stylesheet" href="signup.component.css">
</head>
<body>
  <div class="signup-wrapper">
    <div class="signup-container">
      <h1>Sign up</h1>
      <img src="/assets/signupimage.png" alt="Sign up visual" class="image-container">
      <form class="signup-form">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="email" id="email" placeholder="Your Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <input type="password" id="confirm-password" placeholder="Repeat your password" required>
        <label class="terms">
          <input type="checkbox" id="terms">
          I agree to all statements in <a href="#">Terms of service</a>
        </label>
        <button type="submit">Register</button>
      </form>
    </div>
  </div>
</body>
</html>
